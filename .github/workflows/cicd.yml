name: Task 10 CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Build and Push Docker Images
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/task10-backend:${IMAGE_TAG} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/task10-backend:latest \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/task10-frontend:${IMAGE_TAG} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/task10-frontend:latest \
            ./frontend

      - name: Push backend Docker images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/task10-backend:${IMAGE_TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/task10-backend:latest

      - name: Push frontend Docker images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/task10-frontend:${IMAGE_TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/task10-frontend:latest

  deploy:
    name: Deploy to AWS EC2
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/task10-key.pem
          chmod 600 ~/.ssh/task10-key.pem

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/task10-key.pem "$EC2_USER@$EC2_HOST" <<'REMOTE'
            set -e

            echo "===== TASK 10 EC2 DEPLOYMENT ====="

            cd ~/task10-cicd

            echo "Updating deployment script..."
            git pull origin main

            echo "Running deployment..."
            ./scripts/deploy.sh

            echo "===== DEPLOYMENT VERIFICATION ====="

            curl -f http://localhost/
            echo

            curl -f http://localhost/api/tasks
            echo

            curl -f http://localhost:5000/health
            echo

            echo "===== DEPLOYMENT SUCCESS ====="
          REMOTE

          rm -f ~/.ssh/task10-key.pem
